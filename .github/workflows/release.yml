name: Release
# Publishes a GitHub release with the addon zip whenever the version in the .toc changes on main
# (or when run by hand from the Actions tab). The tag is created here, named after the version.
on:
  push:
    branches: [main]
    paths: ["ForeverWarbandJourney/ForeverWarbandJourney.toc", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          v=$(grep -m1 '^## Version:' ForeverWarbandJourney/ForeverWarbandJourney.toc | sed 's/## Version: *//' | tr -d '\r ')
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Skip if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi
      - name: Build zip and notes
        if: steps.check.outputs.exists != '1'
        run: |
          v="${{ steps.v.outputs.version }}"
          zip -r "ForeverWarbandJourney-$v.zip" ForeverWarbandJourney
          {
            echo "## Install"
            echo "1. Download **ForeverWarbandJourney-$v.zip** below."
            echo '2. Unzip into `World of Warcraft\_forever_\Interface\AddOns\` so you get `AddOns\ForeverWarbandJourney\ForeverWarbandJourney.toc`.'
            echo '3. Restart WoW and type `/fwj`. Log in on each character once, then add goals on the Goals tab.'
            echo
            echo "Optional: Auctionator (prices, shopping list export) and Journey (guide step on the tracker)."
            echo
            echo "## Changes"
            awk -v v="## $v" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md
          } > notes.md
      - uses: softprops/action-gh-release@v2
        if: steps.check.outputs.exists != '1'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Forever Warband Journey ${{ steps.v.outputs.version }}
          body_path: notes.md
          files: ForeverWarbandJourney-*.zip
